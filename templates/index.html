<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danish Editing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b0b0f;
            color: white;
            text-align: center;
        }

        nav {
            padding: 20px;
            background: #111118;
        }

        nav h2 {
            color: #fff;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #9b5cff;
        }

        .hero p {
            color: #aaa;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 14px 28px;
            background: #9b5cff;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            display: inline-block;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .card {
            background: #15151d;
            padding: 30px;
            width: 250px;
            border-radius: 20px;
            border: 1px solid #292933;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #aaa;
        }

        footer {
            padding: 25px;
            color: #777;
            background: #111118;
        }
    </style>
</head>

<body>

    <nav>
        <h2>🖤 Danish Editing</h2>
    </nav>

    <section class="hero">
        <h1>Welcome to <span>Danish Editing</span></h1>
        <p>Cinematic • Creative • Aesthetic</p>
        <a href="#services" class="btn">Explore</a>
    </section>

    <section class="cards" id="services">

        <div class="card">
            <h3>🎬 Video Editing</h3>
            <p>Cinematic and professional video edits.</p>
        </div>

        <div class="card">
            <h3>📸 Photo Editing</h3>
            <p>Premium aesthetic photo editing.</p>
        </div>

        <div class="card">
            <h3>✨ Reels</h3>
            <p>Instagram reels with cinematic vibes.</p>
        </div>

    </section>

    <footer>
        © 2026 Danish Editing
    </footer>

</body>
</html>
